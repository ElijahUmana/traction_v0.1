[project]
name = "traction"
version = "0.1.0"
description = "TRACTION - a persistent prospect graph that finds one human from four directions at once, then emails, calls, and books them. JacHacks SF 2026."
entry-point = "main.jac"
kind = "service"
jac-version = "==0.34.7"

[dependencies]
byllm = "~=0.6"

[byllm.model]
default_model = "anthropic/claude-sonnet-4-6"
api_key = "${ANTHROPIC_API_KEY}"

[byllm.call_params]
temperature = 0.2

[serve]
port = 8000

# REQUIRED for the live dashboard. Without this section the scale WebSocket
# subsystem is never resolved and `@restspec(protocol=APIProtocol.WEBSOCKET)`
# is silently IGNORED - the walker is served as a plain HTTP endpoint, `jac
# check` still passes, and ws://.../ws/walker/LiveFeed returns 404 with no
# error anywhere. Verified on jac 0.34.7 against jac's own fixture walkers.
# Run `jac install` after changing this.
[scale.websocket]
max_connections_per_target = 5000
max_anonymous_per_target = 500
messages_per_second = 100
target_timeout_seconds = 30
backplane = "memory"

[run]
diagnostics = "error"

[test]
directory = "."
