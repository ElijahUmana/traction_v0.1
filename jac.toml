[project]
name = "traction"
version = "0.2.0"
description = "Graph-native founder research agent"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]
byllm = ">=0.5.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]
title = "Traction — Founder research agent"

[byllm.model]
default_model = "gpt-4o-mini"

[byllm.call_params]
temperature = 0.2
max_tokens = 900

[test]
verbose = true
