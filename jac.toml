[project]
name = "traction"
version = "0.1.0"
description = "TRACTION - a persistent prospect graph that finds one human from four directions at once, then emails, calls, and books them. JacHacks SF 2026."
entry-point = "main.jac"
kind = "service"
jac-version = "==0.34.7"

[dependencies]
byllm = "~=0.6"

[byllm.model]
default_model = "anthropic/claude-sonnet-4-6"
api_key = "${ANTHROPIC_API_KEY}"

[byllm.call_params]
temperature = 0.2

[serve]
port = 8000

# WebSocket tuning for the live dashboard. NOT required for WS to work - A/B
# verified: with this block removed, /ws/walker/LiveFeed still registers and
# still returns 101. (An earlier note in this repo claimed it was required; that
# was wrong. The 404 that prompted it was fixed by `jac install` resolving the
# scale deps, not by this block.) Kept because the limits below are deliberate:
# the default 20 msg/sec would throttle the dashboard pump.
[scale.websocket]
max_connections_per_target = 5000
max_anonymous_per_target = 500
messages_per_second = 100
target_timeout_seconds = 30
backplane = "memory"

[run]
diagnostics = "error"

[test]
directory = "."
